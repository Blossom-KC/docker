<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
	<FilesMatch \.php$>
	 SetHandler "proxy:fcgi://blossom-phpfpm:9000"
	</FilesMatch>
	 ProxyTimeout 900
</VirtualHost>
