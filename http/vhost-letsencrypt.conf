# The official httpd image includes mod_md and its dependencies.
<IfModule !watchdog_module>
    LoadModule watchdog_module modules/mod_watchdog.so
</IfModule>
LoadModule md_module modules/mod_md.so

Listen 443
MDStoreDir /usr/local/apache2/md
MDContactEmail ${LE_EMAIL}
MDCertificateAuthority ${LE_CA}
# Enabling this configuration accepts the selected CA's terms of service.
MDCertificateAgreement accepted
# Validate exclusively over HTTPS; public port 80 is not required.
MDCAChallenges tls-alpn-01
MDNotifyCmd /bin/sh /usr/local/bin/apache-mod-md.sh notify

<MDomain ${LE_DOMAIN}>
    MDRequireHttps temporary
</MDomain>

<VirtualHost *:80>
    ServerName ${LE_DOMAIN}
    DocumentRoot /var/www/html
</VirtualHost>

SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
SSLSessionCacheTimeout 300

<VirtualHost *:443>
    ServerName ${LE_DOMAIN}
    DocumentRoot /var/www/html
    SSLEngine on
    Protocols http/1.1 acme-tls/1
    # mod_md supplies the certificate; do not set SSLCertificateFile/KeyFile.
    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://blossom-phpfpm:9000"
    </FilesMatch>
    ProxyTimeout 900
</VirtualHost>
